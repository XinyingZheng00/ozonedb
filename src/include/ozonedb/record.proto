syntax = "proto2";

enum ValueType {
  kTypeDeletion = 0;
  kTypeValue = 1;
}

message Record {
  // maybe add timestamp here
  required bytes key = 1;  // change to bytesz
  optional bytes value = 2;
  required ValueType type = 3;
}

message OperationRecord {
  enum OperationType {
    LOGCREATE = 0;
    COMPACT = 1;
  }
  required OperationType op_type = 1;
  optional bool compact_in_last_level = 2;
  repeated string output_file = 3;
  repeated string key_start = 4;
  repeated string key_end = 5;
  repeated string input_files = 6;  // for COMPACT operations, it's the input files, for CREATE operations, it's the identified current tail.
  // Byte length of each entry in output_file, populated by the compactor so
  // peer writers can avoid a fenced storage->size() call while holding
  // view_mutex during rollforward. Parallel array with output_file. Older
  // records without this field fall back to 0 (heuristic-only, no correctness
  // impact — only feeds getLatestScore()).
  repeated int64 output_bytes = 7;
  // For LOGCREATE: byte length of the sealed log file at input_files[0],
  // populated by the log-rolling writer so peer rollforward can update
  // latest_view.file_size without calling storage->size() under view_mutex.
  // Unset for the very first LOGCREATE (no prior tail); older records
  // without this field fall back to 0 (heuristic-only, feeds getLatestScore).
  optional int64 sealed_input_bytes = 8;
}

// One entry of a transaction's read set: the key and the version the
// transaction observed for it (global log address of the key's last
// accepted write, -1 = unwritten). See CorfuEntry.read_set.
message ReadSetEntry {
  required bytes key = 1;
  required sint64 expected_version = 2;
}

message CorfuEntry {
  enum Op {
    APPEND = 0;
    SEAL = 1;
    REMOVE = 2;
  }
  required string file_name = 1;
  required Op op = 2;
  optional bytes payload = 3;
  // Randomly-generated 64-bit id of the CorfuDBStorage instance that
  // produced this entry. The local tailer uses it to skip entries the
  // local writer has already self-applied into file_buffers_. Optional
  // so entries written before this field existed still parse; those
  // entries just fall through to the unconditional-apply branch.
  optional uint64 client_id = 4;
  // Conditional append: the entry takes effect only if every version
  // it depends on is unchanged at this entry's log position. The check
  // runs in every replica's tailer against the log-ordered key-version
  // map, so all replicas accept or reject identically. A conditional
  // entry is never self-applied by its writer — the writer learns the
  // outcome from its own tailer (CorfuDBStorage::appendConditional /
  // appendTransaction). Two encodings share the flag:
  //   - legacy single-key CAS: expected_version is set, read_set is
  //     empty, and the payload is exactly one Record whose key is the
  //     one checked;
  //   - transaction commit record: expected_version is unset, read_set
  //     carries the {key, version} pairs to validate, and the payload is
  //     the write set (zero or more Records, applied atomically on
  //     accept). An empty read_set accepts unconditionally (atomic
  //     blind multi-record write); an empty payload with a non-empty
  //     read_set is a read-only validation record that appends no bytes.
  optional bool conditional = 5;
  // Legacy CAS only: expected version of the payload's key — the global
  // log address of the entry that last wrote it, or -1 if the key must
  // be unwritten. Its presence selects the legacy encoding above.
  optional sint64 expected_version = 6;
  // Transaction commit record only: the read set to validate. Every
  // entry must match the map at this log position for the entry to be
  // accepted. Keys in the payload but not here are blind writes.
  repeated ReadSetEntry read_set = 7;
}

message TaskRecord {
  message TaskIdentifier {
    repeated string input_files = 1;
    required bool compactIntoNextLevel = 2;
    required uint32 destinationLevel = 3;
  }
  required TaskIdentifier task_id = 1;
  required string owner = 2;
  enum TaskStatus {
    TASK_BEGIN = 0;
    TASK_IN_PROGRESS = 1;
    TASK_COMPLETE = 2;
    TASK_DEAD = 3;
  }
  required TaskStatus status = 3;  // 0 - compete for the task, 1 - task heartbeat, 3 - task complete
  required uint32 owner_generation = 4;
}
