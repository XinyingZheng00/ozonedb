syntax = "proto2";

enum ValueType {
  kTypeDeletion = 0;
  kTypeValue = 1;
}

message Record {
  // maybe add timestamp here
  required bytes key = 1;  // change to bytesz
  optional bytes value = 2;
  required ValueType type = 3;
}

message OperationRecord {
  enum OperationType {
    LOGCREATE = 0;
    COMPACT = 1;
  }
  required OperationType op_type = 1;
  optional bool compact_in_last_level = 2;
  repeated string output_file = 3;
  repeated string key_start = 4;
  repeated string key_end = 5;
  repeated string input_files = 6;  // for COMPACT operations, it's the input files, for CREATE operations, it's the identified current tail.
  // Byte length of each entry in output_file, populated by the compactor so
  // peer writers can avoid a fenced storage->size() call while holding
  // view_mutex during rollforward. Parallel array with output_file. Older
  // records without this field fall back to 0 (heuristic-only, no correctness
  // impact — only feeds getLatestScore()).
  repeated int64 output_bytes = 7;
  // For LOGCREATE: byte length of the sealed log file at input_files[0],
  // populated by the log-rolling writer so peer rollforward can update
  // latest_view.file_size without calling storage->size() under view_mutex.
  // Unset for the very first LOGCREATE (no prior tail); older records
  // without this field fall back to 0 (heuristic-only, feeds getLatestScore).
  optional int64 sealed_input_bytes = 8;
}

message CorfuEntry {
  enum Op {
    APPEND = 0;
    SEAL = 1;
    REMOVE = 2;
  }
  required string file_name = 1;
  required Op op = 2;
  optional bytes payload = 3;
}

message TaskRecord {
  message TaskIdentifier {
    repeated string input_files = 1;
    required bool compactIntoNextLevel = 2;
    required uint32 destinationLevel = 3;
  }
  required TaskIdentifier task_id = 1;
  required string owner = 2;
  enum TaskStatus {
    TASK_BEGIN = 0;
    TASK_IN_PROGRESS = 1;
    TASK_COMPLETE = 2;
    TASK_DEAD = 3;
  }
  required TaskStatus status = 3;  // 0 - compete for the task, 1 - task heartbeat, 3 - task complete
  required uint32 owner_generation = 4;
}
