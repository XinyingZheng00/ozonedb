syntax = "proto2";

enum ValueType {
  kTypeDeletion = 0;
  kTypeValue = 1;
}

message Record {
  // maybe add timestamp here
  required bytes key = 1;  // change to bytesz
  optional bytes value = 2;
  required ValueType type = 3;
}

message OperationRecord {
  enum OperationType {
    LOGCREATE = 0;
    COMPACT = 1;
  }
  required OperationType op_type = 1;
  optional bool compact_in_last_level = 2;
  repeated string output_file = 3;
  repeated string key_start = 4;
  repeated string key_end = 5;
  repeated string input_files = 6;  // for COMPACT operations, it's the input files, for CREATE operations, it's the identified current tail.
  // Byte length of each entry in output_file, populated by the compactor so
  // peer writers can avoid a fenced storage->size() call while holding
  // view_mutex during rollforward. Parallel array with output_file. Older
  // records without this field fall back to 0 (heuristic-only, no correctness
  // impact — only feeds getLatestScore()).
  repeated int64 output_bytes = 7;
  // For LOGCREATE: byte length of the sealed log file at input_files[0],
  // populated by the log-rolling writer so peer rollforward can update
  // latest_view.file_size without calling storage->size() under view_mutex.
  // Unset for the very first LOGCREATE (no prior tail); older records
  // without this field fall back to 0 (heuristic-only, feeds getLatestScore).
  optional int64 sealed_input_bytes = 8;
}

message CorfuEntry {
  enum Op {
    APPEND = 0;
    SEAL = 1;
    REMOVE = 2;
    // Appended by LogTrimmer right before prefixTrim(X); payload is the
    // decimal text of X and file_name is ".trim". It records IN THE STREAM
    // that every entry of this stream at or below X is gone. A process
    // that replays from address S and meets a TRIM with X >= S has no
    // complete history and refuses to open (CorfuDBStorage::bootstrap).
    // Unlike the sequencer's in-memory trim mark this survives a server
    // restart, and unlike the log unit's mark it is per stream.
    TRIM = 3;
  }
  required string file_name = 1;
  required Op op = 2;
  optional bytes payload = 3;
  // Randomly-generated 64-bit id of the CorfuDBStorage instance that
  // produced this entry. The local tailer uses it to skip entries the
  // local writer has already self-applied into file_buffers_. Optional
  // so entries written before this field existed still parse; those
  // entries just fall through to the unconditional-apply branch.
  optional uint64 client_id = 4;
}

// A checkpoint of the shared log: the exact live state after every entry
// with global address <= covered_addr. Written to the object store by
// LogTrimmer, read by CorfuDBStorage::bootstrap so a joining process
// replays only the entries above covered_addr. See PLAN-trimming.md §3.
message CheckpointManifest {
  required int64 covered_addr = 1;       // every entry <= this address is applied
  required int64 prev_covered_addr = 2;  // covered_addr of the previous checkpoint, -1 if none
  message File {
    required string name = 1;
    required int64 size = 2;             // bytes in the file object; 0 => no object written
    optional bool sealed = 3;
    optional int64 sealed_at_addr = 4;   // global address of the SEAL, -1 when unknown
    // True when the file had a buffer in file_buffers_ (an APPEND was seen).
    // A SEAL alone creates no buffer, so a sealed name can have has_buffer=false.
    optional bool has_buffer = 5;
  }
  repeated File files = 3;
  repeated string removed = 4;
  optional string creator = 5;           // writer fingerprint
  optional int64 created_unix_ms = 6;
  // Fields 20-29 are reserved for the `cas` branch (key_versions).
}

message TaskRecord {
  message TaskIdentifier {
    repeated string input_files = 1;
    required bool compactIntoNextLevel = 2;
    required uint32 destinationLevel = 3;
  }
  required TaskIdentifier task_id = 1;
  required string owner = 2;
  enum TaskStatus {
    TASK_BEGIN = 0;
    TASK_IN_PROGRESS = 1;
    TASK_COMPLETE = 2;
    TASK_DEAD = 3;
  }
  required TaskStatus status = 3;  // 0 - compete for the task, 1 - task heartbeat, 3 - task complete
  required uint32 owner_generation = 4;
}
