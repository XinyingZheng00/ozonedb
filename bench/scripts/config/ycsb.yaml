# ===========================================================================
# OzoneDB benchmark configuration
#
# Consumed by bench/scripts/local/*, bench/ansible/* and (bottom section only)
# bench/scripts/cloud/*. There is no schema and no validation: every value is
# used exactly as written, so SHAPES MATTER. Where a scalar and a list are not
# interchangeable it is called out inline.
#
# Everything above the AZURE banner is the CloudLab / shared-log workflow.
# Everything below it is only read by the Azure provisioning scripts.
# ===========================================================================

# --------------------------------------------------------------- defaults --
# Merged into local.load and local.run below via YAML merge keys (`<<:`), which
# yaml.safe_load expands before any script sees them -- so this is a pure-config
# change with no code behind it. These five keys used to be written out twice
# and had to be kept in sync by hand. Override any of them for one phase by
# re-stating the key inside that phase.
defaults: &defaults
  key_size: ["1KB"]
  db_name: ["ozonedb-corfu"]
  threads: [1] # sweep with e.g. [1, 4, 8, 16, 32, 64]
  repeated: 1
  ycsb_data_path: "/tmp/ycsb_data"

local:
  load:
    <<: *defaults
    # LIST. load_local_ycsb*.py iterates this ("for each_record_cnt in ...").
    record_cnt: [1000000]
    # Parallel writer processes. Was absent and silently defaulted to 2.
    num_writers: 2

  run:
    <<: *defaults
    # SCALAR. run_local_ycsb_multiproc.py does int(record_cnt) on it directly.
    # Wrapping this in a list -- to match load.record_cnt above -- breaks the run
    # phase. The two phases genuinely differ; that is not a typo.
    record_cnt: 1000000
    workload_name: ["c"] # a b c d f
    operation_cnt: [999999999]
    # Cap each YCSB run at this many seconds (YCSB -p maxexecutiontime).
    # Unset or 0 means runs are bounded only by operation_cnt.
    max_exec_time: 300

    # Writer-process counts. All three were absent before, which meant the
    # single-node and multi-node runners disagreed about the default: a missing
    # num_writers gave run_local_ycsb_multiproc.py 2, while
    # run_multinode_ycsb.py resolves writers_per_host -> num_writers -> 1 and so
    # got 1. Stated explicitly here at the values that were previously in
    # effect. Note run_multinode_ycsb_with_corfu.sh passes --writers_per_host on
    # every iteration of its sweep, so this is only the fallback.
    num_writers: 2 # single-node runner
    writers_per_host: 1 # multi-node runner, per host
    trial: 1

# ----------------------------------------------------------------- nodes --
# THE source of truth for every address in the cluster. Each machine is named
# once, and everything else is derived by bench/scripts/ycsb_config.py:
#
#   cloudlab.hosts  <- clients[].ssh      corfu.endpoint <- log.lan   : corfu.port
#   cloudlab.*      <- ssh_user, key      s3.endpoint    <- store.lan : s3.port
#
# Two addresses per node, because they are not interchangeable:
#   ssh   how YOU reach it        -- public CloudLab name, routable from a laptop
#   lan   how OTHER NODES reach it -- internal 10.10.1.x
# `corfu_server -a <addr>` binds the address it is handed, so it must be the LAN
# one or no client can connect; the sweep script must SSH to the same box, which
# from off-cluster needs the public one. Previously only one of the two was ever
# recorded, and the corfu host was additionally hardcoded in both sweep wrappers
# -- where it had already drifted to 10.10.1.2, the MinIO node.
#
# `ssh:` may be omitted, in which case `lan:` is used for SSH too. That is the
# old behaviour and works when you orchestrate from inside CloudLab. Add the
# public names to drive a sweep from your laptop.
nodes:
  ssh_user: "oliverr3"
  ssh_private_key_path: "~/.ssh/cloudlab"

  # Shared log. Also the -a bind address for corfu_server.
  log:
    lan: "10.10.1.3"
    # ssh: "<public name of the log node>"

  # SSTable object store (MinIO).
  store:
    lan: "10.10.1.2"
    # ssh: "<public name of the store node>"

  # YCSB writer nodes. `ssh` is required; `lan` is documentation for now.
  # A bare string is shorthand for {ssh: ...}.
  clients:
    - ssh: "ms0917.utah.cloudlab.us"
    - ssh: "ms0943.utah.cloudlab.us"

# ------------------------------------------------------------------ corfu --
# Only consumed when db_name includes "ozonedb-corfu". The bridge jar path is
# derived from $OZONEDB_HOME/ozonedb-jni-maven/corfu-bridge/target/ and is not
# configured here.
#
# `endpoint` is NOT set here -- it is derived as nodes.log.lan:port. Setting it
# by hand is rejected at load time rather than silently shadowing nodes:.
corfu:
  port: 9090
  stream_name: "ozonedb-ycsb"
  jvm_opts: "-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 --add-opens=java.base/java.util=ALL-UNNAMED"

# --------------------------------------------------------------------- s3 --
# S3-compatible store for SSTables (paper §3.5 split). Any S3 API works: AWS,
# MinIO, R2, Wasabi, SeaweedFS, B2. `bash bench/scripts/setup.sh --role minio`
# provisions this on a node and creates the bucket named below.
#
# access_key/secret_key are MinIO's throwaway defaults, not credentials worth
# protecting. Point endpoint at a real S3 and they become real -- move them to
# the environment at that point rather than committing them.
#
# `endpoint` is NOT set here -- it is derived as scheme://nodes.store.lan:port.
s3:
  scheme: "http"
  port: 9000
  region: "us-east-1"
  bucket: "ozonedb-ycsb"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_path_style: true
  sstable_dir: "sstables"

# ------------------------------------------- compaction-contention overrides
# Read only by run_corfu_compaction_contention.py, which merges these INTO the
# corfu settings before _make_corfu_config_per_writer writes the per-writer
# JSON. The regular run_local_ycsb_multiproc.py path ignores this block.
#
# Tunes ozonedb to fire many small compactions per writer (target 20-50 per
# trial), which is what makes the contention measurement meaningful. The
# shared_config_base.json defaults (32 MB log files, 256 MB L1, 64 MB output)
# would produce only a handful across a 1M-record run.
#
# level_size and level_file_size_limit are STRINGS: shared_config_base.json is
# parsed by Metadata, which splits "[a, b, ...]" into a vector at load time.
corfu_compaction_experiment:
  log_file_size_limit: 2097152 # 2 MiB
  base_file_number_limit: 2
  level_size: "[8388608, 33554432, 134217728]" # 8 MiB / 32 MiB / 128 MiB
  level_file_size_limit: "[2097152, 4194304, 8388608]" # 2 MiB / 4 MiB / 8 MiB
  max_level: 3

# ===========================================================================
# AZURE  --  everything below is read only by bench/scripts/cloud/*.
# Irrelevant to the CloudLab / shared-log workflow above.
#
# Removed as unreferenced by any script: github_username, ozonedb_branch,
# postgres, mysql, azure_sql.
# Moved to the environment (were committed secrets):
#   github_token   -> $GITHUB_TOKEN        (bench/scripts/cloud/create/setup_vms.py)
#   azure.password -> $AZURE_VM_PASSWORD   (create_azure_vms.py, load_cosmosdb.py)
# ===========================================================================

# azure: discover VMs via Azure Resource Manager (needs AZURE_SUBSCRIPTION_ID).
# cloudlab: SSH targets from cloudlab.hosts above (no Azure VM APIs).
cloud:
  vmprovider: cloudlab
  load:
    record_cnt:
      - 10000
    key_size:
      - "1KB"
    repeated: 1
    ycsb_data_path: "ycsb-data"
    threads: 1
  run:
    workload_name:
      - "a"
    operation_cnt:
      - 1000
    record_cnt: 10000
    key_size:
      - "1KB"
    threads: 1
    repeated: 1
    ycsb_data_path: "ycsb-data"

id: "testrun"

azure:
  location: "eastus2"
  username: "Xinying"
  # password: now $AZURE_VM_PASSWORD

storage:
  account_name: "ozonedbstorage"
  # Optional secret string (not a file path): for cloudlab or when not using the
  # Azure CLI to list storage keys. Or export AZURE_STORAGE_KEY instead.
  # account_key: ""

cosmosdb:
  account_name: "ozonedb-cosmosdb-account"
  consistency_level: "Eventual"
  mode: "serverless"

resource_group:
  name: "ozonedb_test"

network:
  vnet_name: "ozonedb-test-vnet"
  vnet_address_prefix: "10.0.0.0/16"
  subnet_name: "default"
  subnet_address_prefix: "10.0.0.0/24"
  ip_name: "ozonedb-test-ip"
  ip_config_name: "ozonedb-test-ip-config"
  nic_name: "ozonedb-test-nic"

vm:
  num: 1
  name: "test-vm"
  # Path to the SSH *public* key file (.pub) for VM provisioning / authorized_keys.
  ssh_public_key_path: "~/.ssh/id_rsa.pub"
  # Matching *private* key for ssh/scp -i when vmprovider is azure.
  ssh_private_key_path: "~/.ssh/id_rsa"
  vm_size: "Standard_D4s_v3"
  image_reference:
    publisher: "Canonical"
    offer: "0001-com-ubuntu-server-focal"
    sku: "20_04-lts-gen2"
    version: "latest"
