# ===========================================================================
# OzoneDB benchmark configuration
#
# Consumed by bench/scripts/local/* and bench/ansible/*, always through
# bench/scripts/ycsb_config.py rather than yaml.safe_load directly.
# ===========================================================================

# --------------------------------------------------------------- defaults --
# Merged into local.load and local.run below via YAML merge keys (`<<:`),
defaults: &defaults
  key_size: ["1KB"]
  # ozonedb-corfu | cassandra | rocksdb | ozonedb | sqlite. For one sweep,
  # pass --db_name to the runners instead of editing this (the multinode
  # wrappers do): a YAML edit has to be synced to every client.
  db_name: ["ozonedb-corfu"]
  threads: [1] # sweep with e.g. [1, 4, 8, 16, 32, 64]
  # Must stay 1 for the run phase: run_local_ycsb_multiproc.py refuses
  # anything else, because every repeat rewrites the same _trial{N} result
  # files. Repetition is expressed as trials (--trial N / --trials N).
  repeated: 1
  ycsb_data_path: "/tmp/ycsb_data"

local:
  load:
    <<: *defaults
    # LIST. load_local_ycsb*.py iterates this ("for each_record_cnt in ...").
    record_cnt: [1000000]
    # Parallel writer processes. Was absent and silently defaulted to 2.
    num_writers: 2

  run:
    <<: *defaults
    # SCALAR. run_local_ycsb_multiproc.py does int(record_cnt) on it directly.
    # Wrapping this in a list -- to match load.record_cnt above -- breaks the run
    # phase. The two phases genuinely differ; that is not a typo.
    record_cnt: 1000000
    workload_name: ["c"] # a b c d f
    operation_cnt: [999999999]
    # Cap each YCSB run at this many seconds (YCSB -p maxexecutiontime).
    # Unset or 0 means runs are bounded only by operation_cnt. For one sweep,
    # run_multinode_ycsb_with_corfu.sh --duration (run_multinode_ycsb.py
    # --max_exec_time) overrides this on every client without editing it.
    max_exec_time: 300

    # Writer-process counts.
    num_writers: 2 # single-node runner
    writers_per_host: 1 # multi-node runner, per host
    trial: 1

# ----------------------------------------------------------------- nodes --
# THE source of truth for every address in the cluster. Each machine is named
# once, and everything else is derived by bench/scripts/ycsb_config.py:
#
#   cloudlab.hosts  <- clients[].ssh      corfu.endpoint <- log.lan   : corfu.port
#   cloudlab.*      <- ssh_user, key      s3.endpoint    <- store.lan : s3.port
#
# Two addresses per node, because they are not interchangeable:
#   ssh   how YOU reach it        -- public CloudLab name, routable from a laptop
#   lan   how OTHER NODES reach it -- internal 10.10.1.x
# `corfu_server -a <addr>` binds the address it is handed, so it must be the LAN
# one or no client can connect; the sweep script must SSH to the same box, which
# from off-cluster needs the public one. Previously only one of the two was ever
# recorded, and the corfu host was additionally hardcoded in both sweep wrappers
# -- where it had already drifted to 10.10.1.2, the MinIO node.
#
# `ssh:` may be omitted, in which case `lan:` is used for SSH too. That is the
# old behaviour and works when you orchestrate from inside CloudLab. Add the
# public names to drive a sweep from your laptop.
nodes:
  ssh_user: "oliverr3"
  ssh_private_key_path: "~/.ssh/id_ed25519"

  # CorfuDB
  log:
    ssh: "amd132.utah.cloudlab.us"
    lan: "10.10.1.0"

  # Object Store
  store:
    ssh: "amd132.utah.cloudlab.us"
    lan: "10.10.1.0"

  # Cassandra baseline server(s) -- a LIST, one entry is the common case.
  # Optional: when absent, `log` is used, so Cassandra takes CorfuDB's box and
  # both systems get identical server hardware. Never run both servers at
  # once. Add nodes (and raise cassandra.replication_factor) for an RF=3 run.
  cassandra:
    - ssh: "amd132.utah.cloudlab.us"
      lan: "10.10.1.0"

  clients:
    - ssh: "amd159.utah.cloudlab.us"
      lan: "10.10.1.1"
    - ssh: "amd124.utah.cloudlab.us"
      lan: "10.10.1.2"
    - ssh: "amd164.utah.cloudlab.us"
      lan: "10.10.1.3"
    - ssh: "amd151.utah.cloudlab.us"
      lan: "10.10.1.4"
    - ssh: "amd129.utah.cloudlab.us"
      lan: "10.10.1.5"
    - ssh: "amd155.utah.cloudlab.us"
      lan: "10.10.1.6"
    - ssh: "amd167.utah.cloudlab.us"
      lan: "10.10.1.7"
    - ssh: "amd168.utah.cloudlab.us"
      lan: "10.10.1.8"

# ------------------------------------------------------------------ corfu --
corfu:
  port: 9090
  stream_name: "ozonedb-ycsb"
  jvm_opts: "-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 --add-opens=java.base/java.util=ALL-UNNAMED"
  # Read mode: leave unset here. Pass --linearizable to
  # run_multinode_ycsb_with_corfu.sh / run_multinode_ycsb.py /
  # run_local_ycsb_multiproc.py (or consistency.py): it sets
  # linearizable_reads=true + trust_background_tail=false in every writer's
  # generated shared_config AND labels the result files
  # ozonedb-corfu-linearizable. `linearizable_reads: true` here is honoured
  # and labelled the same way, but it has to be synced to every client per
  # cell -- a forgotten sync is how two identical "default" sweeps happen.

# --------------------------------------------------------------------- s3 --
# S3-compatible store for SSTables
# `bash bench/scripts/setup.sh --role minio`
# provisions this on a node and creates the bucket named below.
s3:
  scheme: "http"
  port: 9000
  region: "us-east-1"
  bucket: "ozonedb-ycsb"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_path_style: true
  sstable_dir: "sstables"

# -------------------------------------------------------------- cassandra --
# Server-based baseline for the consistency/throughput frontier.
#   bash bench/scripts/setup.sh --role cassandra        # on each nodes.cassandra
#   bash bench/scripts/local/load_multinode_cassandra.sh
#   bash bench/scripts/local/run_multinode_ycsb_with_cassandra.sh --consistency serial
# hosts / ssh_hosts / contact_points are derived from nodes: -- never set them
# here. The binding's knobs are documented in ycsb/cassandra/README.md.
cassandra:
  version: "5.0.5"
  install_dir: "/tank/cassandra"
  port: 9042
  keyspace: "ycsb"
  replication_factor: 1
  # Consistency mode: one | quorum | serial.
  #   one     read ONE,    write ONE            (eventual)
  #   quorum  read QUORUM, write QUORUM         (default; == one at RF=1)
  #   serial  read SERIAL, write QUORUM + LWT   (linearizable: Paxos per write)
  # Pass --consistency to the sweep wrapper instead of editing this: an edit
  # has to be synced to every client, and the result label is derived from
  # the effective mode either way (cassandra-one / -quorum / -serial).
  consistency: "quorum"
  # Server JVM heap (MAX_HEAP_SIZE / HEAP_NEWSIZE, which cassandra-env.sh
  # requires as a pair). 31G keeps compressed oops; Cassandra's own default
  # caps at 8G, which would handicap the baseline.
  heap: "31G"
  new_heap: "8G"
  # Columns in usertable; must equal fieldcount in the YCSB workload template.
  fields: 10

# ------------------------------------------- compaction-contention overrides
# Read only by run_corfu_compaction_contention.py, which merges these INTO the
# corfu settings before _make_corfu_config_per_writer writes the per-writer
# JSON. The regular run_local_ycsb_multiproc.py path ignores this block.
#
# Tunes ozonedb to fire many small compactions per writer (target 20-50 per
# trial), which is what makes the contention measurement meaningful. The
# shared_config_base.json defaults (32 MB log files, 256 MB L1, 64 MB output)
# would produce only a handful across a 1M-record run.
#
# level_size and level_file_size_limit are STRINGS: shared_config_base.json is
# parsed by Metadata, which splits "[a, b, ...]" into a vector at load time.
corfu_compaction_experiment:
  log_file_size_limit: 2097152 # 2 MiB
  base_file_number_limit: 2
  level_size: "[8388608, 33554432, 134217728]" # 8 MiB / 32 MiB / 128 MiB
  level_file_size_limit: "[2097152, 4194304, 8388608]" # 2 MiB / 4 MiB / 8 MiB
  max_level: 3
