# Corfu backend settings (only consumed when db_name includes "ozonedb-corfu").
# The jar path is derived from $OZONEDB_HOME/ozonedb-jni-maven/corfu-bridge/target/corfu-bridge-all.jar
# and does not need to be listed here.
corfu:
  endpoint: "10.10.1.2:9090"
  stream_name: "ozonedb-ycsb"
  jvm_opts: "-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 --add-opens=java.base/java.util=ALL-UNNAMED"

# Compaction-contention experiment overrides. Read by
# run_corfu_compaction_contention.py and merged INTO corfu_settings before
# _make_corfu_config_per_writer writes the per-writer JSON. Not consumed by
# the regular run_local_ycsb_multiproc.py path.
#
# Tunes ozonedb to fire many small compactions per writer (target 20-50 per
# trial), which is what makes the contention measurement meaningful. Defaults
# from shared_config_base.json (32 MB log files, 256 MB L1, 64 MB output)
# would only produce a handful of compactions across a 1M-record run.
#
# level_size and level_file_size_limit are strings to match the format
# shared_config_base.json expects (the JSON parser splits the "[a, b, ...]"
# string into a vector at config-load time).
corfu_compaction_experiment:
  log_file_size_limit: 2097152 # 2 MiB
  base_file_number_limit: 2
  level_size: "[8388608, 33554432, 134217728]" # 8 MiB / 32 MiB / 128 MiB
  level_file_size_limit: "[2097152, 4194304, 8388608]" # 2 MiB / 4 MiB / 8 MiB
  max_level: 3

# S3-compatible storage for SSTables (paper §3.5 split). When set, SSTables
# are written to this object store instead of the main backend. Works with
# any service that speaks the S3 API: real AWS S3, MinIO, R2, Wasabi,
# SeaweedFS, B2. For MinIO local dev:
#   docker run --rm -p 9000:9000 -p 9001:9001 \
#     -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
#     minio/minio server /data --console-address ":9001"
#   mc alias set local http://127.0.0.1:9000 minioadmin minioadmin
#   mc mb local/ozonedb-sstables
s3:
  endpoint: "http://10.10.1.2:9000"
  region: "us-east-1"
  bucket: "ozonedb-ycsb"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_path_style: true
  sstable_dir: "sstables"

