---
# Push the local working tree to every CloudLab client host at once.
#
# The fast inner loop, for a node that bootstrap.yml already stood up: skips
# .git/ and vcpkg/ (11.7k vendored port files that never change between edits)
# and moves only what you actually touched.
#
#   cd $OZONEDB_HOME/bench/ansible
#   ansible-playbook sync.yml                        # push to every host
#   ansible-playbook sync.yml -e build=true          # push, then build.sh on each host
#   ansible-playbook sync.yml --check --diff         # dry run (rsync -n)
#   ansible-playbook sync.yml --limit amd172.utah.cloudlab.us
#   ansible-playbook sync.yml -e delete=true         # mirror: prune remote-only files
#
# Sibling repos ride along:
#   ansible-playbook sync.yml \
#     -e '{"extra_repos":[{"src":"../../../slatedb/","dest":"slatedb"}]}'
# Relative src resolves against this directory, relative dest against the remote
# user's home.
#
# For a node that has never been set up, use bootstrap.yml instead.

- name: Sync the OzoneDB working tree to the CloudLab clients
  hosts: "{{ target | default('clients') }}"
  gather_facts: false
  # free: a slow host doesn't hold up the others at each task boundary.
  strategy: free

  vars:
    repo_src: "{{ playbook_dir }}/../../"
    extra_repos: []
    build: false
    delete: false

  tasks:
    - name: Resolve the destination path
      ansible.builtin.include_tasks: tasks/resolve_dest.yml
      tags: [sync, build]

    - name: Ensure the destination directory exists
      ansible.builtin.file:
        path: "{{ repo_dest }}"
        state: directory
        mode: "0755"
      tags: [sync]

    - name: Sync ozonedb
      ansible.posix.synchronize:
        src: "{{ repo_src }}"
        dest: "{{ repo_dest }}/"
        # archive implies -o/-g, which a non-root rsync cannot honour and which
        # produce spurious "changed" churn. Everything else in -a is wanted.
        owner: false
        group: false
        compress: true
        delete: "{{ delete | bool }}"
        # Reuse the ControlPersist connection from ansible.cfg.
        use_ssh_args: true
        rsync_opts: "{{ rsync_excludes_incremental }}"
      register: sync_result
      tags: [sync]

    # rsync -a preserves the SOURCE mtime, which is the operator's local
    # edit time. When that time falls before the node's last build -- easy
    # across machines with different clocks, or after a rebase that
    # restores an older file -- make sees a source older than its .o and
    # skips it. The build then succeeds while silently linking stale
    # objects, and the node runs code that is not what was pushed.
    #
    # Stamp the sources with the current node time whenever anything was
    # transferred, so make compares against times it set itself. This
    # forces a full rebuild after a sync that changed something, which
    # costs about a minute on a 32-core node -- cheap next to debugging a
    # binary that does not contain the change you just pushed.
    - name: Refresh source mtimes so make rebuilds what changed
      ansible.builtin.raw: >-
        bash -lc 'cd {{ repo_dest | quote }} &&
        find src tests ozonedb-jni-maven CMakeLists.txt -type f -exec touch {} + 2>/dev/null; true'
      when: sync_result is changed
      changed_when: false
      tags: [sync]

    - name: Sync extra repos
      ansible.posix.synchronize:
        src: "{{ (item.src if item.src.startswith('/') else playbook_dir ~ '/' ~ item.src) }}"
        dest: "{{ item.dest }}/"
        owner: false
        group: false
        compress: true
        delete: "{{ item.delete | default(delete) | bool }}"
        use_ssh_args: true
        rsync_opts: "{{ item.rsync_opts | default(rsync_excludes_incremental) }}"
      loop: "{{ extra_repos }}"
      loop_control:
        label: "{{ item.src }} -> {{ item.dest }}"
      tags: [sync]

    - name: Rebuild OzoneDB + JNI shim + YCSB binding
      ansible.builtin.shell: bash -lc 'cd {{ repo_dest | quote }} && bash bench/scripts/build.sh'
      register: build_result
      changed_when: true
      when: build | bool
      async: 3600
      poll: 15
      tags: [build]

    - name: Show the tail of each build
      ansible.builtin.debug:
        msg: "{{ build_result.stdout_lines[-15:] | default([]) }}"
      when: build | bool
      tags: [build]
