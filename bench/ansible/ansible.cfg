# Only read when ansible is invoked from this directory (ansible ignores a
# cfg in a world-writable cwd), so run the playbooks from bench/ansible/ --
# or export ANSIBLE_CONFIG=$OZONEDB_HOME/bench/ansible/ansible.cfg.

[defaults]
inventory = ./inventory.py
host_key_checking = False
# One fork per host: the whole point is that N hosts sync concurrently
# instead of one ../sync-ozonedb.sh invocation after another.
forks = 32
stdout_callback = yaml
interpreter_python = auto_silent
retry_files_enabled = False
# CloudLab nodes come and go; don't cache facts across re-swaps.
gathering = explicit

[ssh_connection]
pipelining = True
# ControlPersist is the single biggest win on a WAN link: every task after the
# first reuses one TCP+SSH handshake instead of paying ~1 RTT each. rsync picks
# this up too, via use_ssh_args on the synchronize tasks.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
